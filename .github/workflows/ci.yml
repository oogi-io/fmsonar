name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]  # floor + latest; code declares >=3.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run test suite (parser + JS parity)
        run: python3 -m unittest discover tests -v

  windows:
    # The code's only run on Windows: the suite, then the three commands the README shows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install .
      - name: Run test suite
        run: python -m unittest discover tests -v
      - name: The README's commands
        run: |
          fmsonar --version
          fmsonar build tests\fixtures\micro_ddr.xml -o lab.db
          fmsonar where lab.db "CTC::email"
